<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar with Forms</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        nav {
            background: #333;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            padding: 5px 10px;
        }
        nav a:hover {
            background: #555;
        }
        .container {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="loggin.html">Login</a>
        <a href="signup.html">Signup</a>
    </nav>


    <div id="login" class="container">
        <h2>Login</h2>
        <form id="fm">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        const fm = document.getElementById('fm');
        fm.addEventListener('submit', async(e)=>{
            e.preventDefault();
            const username = fm.email.value;
            const password = fm.password.value;
            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: "POST",
                    headers: {'Content-Type':"application/json"},
                    body: JSON.stringify({
                        username, password
                    })
                });
                const data = await response.json();
                console.log(data);
            } catch (error) {
                console.log("could not do the request bcz", error);
            }
        })
    </script>
</body>
</html>
